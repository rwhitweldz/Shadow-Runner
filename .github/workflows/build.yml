
name: Build Shadow Runner

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract game project
        run: |
          mkdir extracted
          unzip -q Shadow_Runner_Android_Project.zip -d extracted
          cp -r extracted/. .

      - name: Force Java compiler target to 17
        run: |
          cat > force-jvm17.gradle <<'EOF'
          allprojects {
              tasks.withType(org.gradle.api.tasks.compile.JavaCompile).configureEach {
                  sourceCompatibility = "17"
                  targetCompatibility = "17"
              }
          }
          EOF

      - name: Build APK
        run: gradle --no-daemon -Pkotlin.jvm.target.validation.mode=warning :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shadow-runner-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
